plugins {
    id "com.android.library"
}

group = "app.fuelet.flutter_fuelet_smart_contract_wallet"
version = "1.0"

android {
    namespace = "app.fuelet.flutter_fuelet_smart_contract_wallet"

    compileSdk = 35
    ndkVersion = "28.0.12433566"

    defaultConfig {
        minSdk = 23
        targetSdk = 35
    }

    externalNativeBuild {
        cmake {
            path file("CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

repositories {
    google()
    mavenCentral()
}